
spring.application.name=employee-backend-test

# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:employeetest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Test-only JWT Configuration
# Never use this key in production.
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expiration-ms=900000

# Disable Admin Bootstrap During Tests
app.admin.bootstrap-enabled=false
app.admin.username=
app.admin.email=
app.admin.password=
